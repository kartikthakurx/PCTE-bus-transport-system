<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin | Users</title>
<style>
  :root{--bg:#0d111c;--card:rgba(255,255,255,.07);--border:rgba(255,255,255,.1);--text:#eaeaea;--accent:#09FBD3;--accent2:#6C63FF}
  body{margin:0;font-family:Inter,system-ui;background:var(--bg);color:var(--text)}
  nav{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;background:#0b1020aa;border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
  nav a{color:var(--text);text-decoration:none;padding:8px 10px;border-radius:10px}
  nav a:hover{background:#ffffff14}

  .wrap{max-width:1200px;margin:26px auto;padding:0 16px}
  h1{margin:0 0 18px;color:var(--accent);letter-spacing:.6px}

  .grid{display:grid;grid-template-columns: 420px 1fr; gap:16px}
  .card{background:var(--card);border:1px solid var(--border);border-radius:16px;padding:18px}

  input,select{width:100%;padding:12px;border-radius:12px;border:1px solid var(--border);background:#0a0f1a;color:var(--text);box-sizing:border-box}
  label{font-size:.95rem;opacity:.9;margin-bottom:6px;display:block}
  .btn{padding:10px 12px;border-radius:12px;border:1px solid var(--border);background:#ffffff14;color:#eaeaea;cursor:pointer}
  .btn.primary{background:linear-gradient(90deg,var(--accent2),var(--accent));border:0;color:#041016;font-weight:800}
  .toolbar{display:flex;gap:8px;margin-top:10px}

  table{width:100%;border-collapse:collapse}
  th,td{padding:12px 14px;border-bottom:1px solid #ffffff14;text-align:left}
  th{background:#111834}

  .pill{display:inline-block;padding:6px 10px;border-radius:999px;background:#ffffff14;margin-left:6px;font-size:.85rem}
  .muted{opacity:.85}
  @media(max-width:1000px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>

<nav>
  <div>Admin • Users</div>
  <div>
    <a href="dashboard.html">Dashboard</a>
    <a href="routes.html">Routes</a>
    <a href="timetable.html">Timetable</a>
    <a href="users.html">Users</a>
  </div>
</nav>

<div class="wrap">
  <h1>Users</h1>

  <div class="grid">
    <!-- Left: form -->
    <div class="card">
      <h3 style="margin:0 0 10px">Add / Edit User</h3>
      <div>
        <label>Full Name</label>
        <input id="u_name" placeholder="e.g., Harsh Kumar">
      </div>
      <div style="margin-top:10px">
        <label>Email</label>
        <input id="u_email" type="email" placeholder="name@pcte.edu.in">
      </div>
      <div style="margin-top:10px">
        <label>Role</label>
        <select id="u_role">
          <option value="ADMIN">ADMIN</option>
          <option value="STAFF">STAFF</option>
          <option value="VIEWER">VIEWER</option>
        </select>
      </div>
      <div style="margin-top:10px">
        <label>Password</label>
        <input id="u_pass" type="password" placeholder="Set/Reset password">
      </div>
      <div class="toolbar">
        <button class="btn primary" onclick="saveUser()">Save</button>
        <button class="btn" onclick="clearForm()">Clear</button>
        <span id="msg" class="muted"></span>
      </div>
    </div>

    <!-- Right: table -->
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">All Users</h3>
        <div>
          <input id="q" placeholder="Search user…" style="width:260px">
        </div>
      </div>
      <table>
        <thead><tr><th>Name</th><th>Email</th><th>Role</th><th style="width:160px">Actions</th></tr></thead>
        <tbody id="rows">
          <tr><td colspan="4" class="muted">Loading…</td></tr>
        </tbody>
      </table>
    </div>
  </div>
</div>

<script>
const API = "http://localhost:8080/api";

let USERS = [];
let editId = null;

function setMsg(t){ document.getElementById('msg').textContent = t || ''; }
function val(id){ return document.getElementById(id).value.trim(); }
function clearForm(){
  editId = null;
  ['u_name','u_email','u_pass'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('u_role').value='STAFF';
  setMsg('');
}

async function loadUsers(){
  try{
    const r = await fetch(`${API}/users`);
    const data = await r.json();
    if(Array.isArray(data)) USERS = data;
  }catch(e){
    USERS = [
      {id:1,name:'Super Admin',email:'admin@pcte.edu',role:'ADMIN'},
      {id:2,name:'Transport Staff',email:'transport@pcte.edu',role:'STAFF'}
    ];
  }
  render(USERS);
}


function render(list){
  const tb = document.getElementById('rows');
  if(!list.length){ tb.innerHTML = `<tr><td colspan="4" class="muted">No users found.</td></tr>`; return; }
  tb.innerHTML = '';
  list.forEach(u=>{
    const tr = document.createElement('tr');
    tr.innerHTML = `
      <td>${u.name}</td>
      <td>${u.email}</td>
      <td>${u.role} ${u.role==='ADMIN' ? '<span class="pill">full</span>' : ''}</td>
      <td>
        <button class="btn" onclick="editUser(${u.id})">Edit</button>
        <button class="btn" onclick="delUser(${u.id})">Delete</button>
      </td>`;
    tb.appendChild(tr);
  });
}

document.getElementById('q').oninput = e=>{
  const t = e.target.value.toLowerCase();
  const f = USERS.filter(u => (u.name||'').toLowerCase().includes(t) || (u.email||'').toLowerCase().includes(t) || (u.role||'').toLowerCase().includes(t));
  render(f);
};

function editUser(id){
  const u = USERS.find(x=>x.id===id); if(!u) return;
  editId = id;
  document.getElementById('u_name').value = u.name || '';
  document.getElementById('u_email').value = u.email || '';
  document.getElementById('u_role').value = u.role || 'STAFF';
  document.getElementById('u_pass').value = '';
  setMsg('Editing user');
}

async function saveUser(){
  const payload = {
    name: val('u_name'),
    email: val('u_email'),
    role: document.getElementById('u_role').value,
    password: val('u_pass') || undefined
  };
  if(!payload.name || !payload.email){ return setMsg('Name and email are required'); }

  // Try backend; fallback to local update
  try{
    if(editId){
      const r = await fetch(`${API}/users/${editId}`, {method:'PUT', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if(!r.ok) throw 0;
      const idx = USERS.findIndex(x=>x.id===editId);
      if(idx>=0) USERS[idx] = {...USERS[idx], ...payload};
      setMsg('Updated');
    }else{
      const r = await fetch(`${API}/users`, {method:'POST', headers:{'Content-Type':'application/json'}, body:JSON.stringify(payload)});
      if(!r.ok) throw 0;
      const saved = await r.json().catch(()=>({id:Date.now()}));
      USERS.push({id:saved.id || Date.now(), ...payload});
      setMsg('Created');
    }
  }catch(e){
    // Local demo behavior
    if(editId){
      const idx = USERS.findIndex(x=>x.id===editId);
      if(idx>=0) USERS[idx] = {...USERS[idx], ...payload};
      setMsg('Updated locally (demo)');
    }else{
      USERS.push({id:Date.now(), ...payload});
      setMsg('Created locally (demo)');
    }
  }
  render(USERS);
  clearForm();
}

async function delUser(id){
  if(!confirm('Delete this user?')) return;
  try{
    const r = await fetch(`${API}/users/${id}`, {method:'DELETE'});
    if(!r.ok) throw 0;
  }catch(e){}
  USERS = USERS.filter(x=>x.id!==id);
  render(USERS);
  setMsg('Deleted');
}

loadUsers();
</script>
</body>
</html>
